<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HD PLUS KIDS</title>

<link rel="stylesheet" href="peliculas.css">

</head>
<body>

<!-- LOADER -->
<div class="loader" id="loader">
  <div class="loader-circle"></div>
  <h2>Cargando Películas Infantiles...</h2>
</div>

<!-- NAVBAR -->
<nav class="navbar">
  <div class="logo">HD PLUS</div>

  <div class="submenu" id="submenu">
    <a href="index.html">Inicio</a>
    <a href="peliculas.html">Películas</a>
    <a href="dibujos.html">Dibujos</a>
    <a href="anime.html">Anime Kids</a>
    <a href="series.html">Series</a>
  </div>

  <div class="search-box">
    <span class="search-icon">🔍</span>
    <input id="searchInput" type="text" placeholder="Buscar dibujos...">
  </div>

  <div class="menu-icon" id="menuIcon">☰</div>
</nav>

<div class="hero-carousel">
  <button class="carousel-btn left" onclick="prevSlide()">❮</button>
  <div class="carousel-wrapper" id="carouselWrapper"></div>
  <button class="carousel-btn right" onclick="nextSlide()">❯</button>
</div>

<div class="carousel-dots" id="carouselDots"></div>

<!-- CONTENIDO DINÁMICO -->
<div id="content"></div>

<!-- MODAL (MISMO SISTEMA QUE PELÍCULAS) -->
<div class="modal" id="movieModal">
  <div class="modal-content">
    <span class="close" onclick="closeMovie()">✖</span>
    <img id="movieImg" alt="Portada">
    <div class="modal-info">
      <h2 id="movieTitle"></h2>
      <p id="movieDescription"></p>
      <iframe class="player" id="moviePlayer" allowfullscreen></iframe>
    </div>
  </div>
</div>

<script src="dibujos.js"></script>

</body>
</html>
